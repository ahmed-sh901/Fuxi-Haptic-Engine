
name: Build Fuxi Haptics Engine v0.5.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lsposed-module/**'
      - '.github/workflows/build-observer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: |
          python3 -c "import subprocess; p=subprocess.run(['sdkmanager','--licenses'],input=('y\n'*100).encode(),stdout=subprocess.PIPE,stderr=subprocess.STDOUT); print(p.stdout.decode()); raise SystemExit(p.returncode)"

      - name: Install Android SDK platform
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: lsposed-module
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fuxi-Haptics-Engine-v0.5.0-debug
          path: lsposed-module/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error0

