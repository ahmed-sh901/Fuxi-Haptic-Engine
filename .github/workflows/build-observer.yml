name: Build Fuxi Haptics Engine v0.5.0 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'lsposed-module/**'
      - '.github/workflows/build-observer.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: lsposed-module
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fuxi-Haptics-Engine-v0.5.0-debug
          path: lsposed-module/app/build/outputs/apk/debug/app-debug.apk
